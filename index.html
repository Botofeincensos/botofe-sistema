.row.rh{color:var(--mu);font-size:12px;margin-bottom:2px}.row.rh span:nth-child(n+2){text-align:right}.row{display:grid;grid-template-columns:minmax(0,1fr) 72px 104px 104px 34px;gap:8px;margin-bottom:8px;align-items:center}.row .u{color:var(--mu);font-size:14px}

.np{display:grid;grid-template-columns:minmax(0,1fr) 96px 30px;gap:6px;align-items:center;margin-bottom:6px}.np input{padding:6px 8px;text-align:right}.np .btn.s{padding:4px 0}

const ini=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const iso=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+dd};
const pd=s=>new Date(s+'T12:00:00');
const fd=s=>{if(!s)return '';const[a,b,c]=s.split('-');return c+'/'+b+'/'+a};
const T=new Date();T.setHours(12,0,0,0);const TODAY=iso(T);
const ago=n=>{const x=new Date(T);x.setDate(x.getDate()-n);return iso(x)};
const addBD=(d,n)=>{const x=new Date(d);while(n>0){x.setDate(x.getDate()+1);const w=x.getDay();if(w!==0&&w!==6)n--}return x};

function chave(c,x){return x.id!=null?String(x.id):c==='F'?x.k:(x._k||(x._k=Date.now().toString(36)+Math.random().toString(36).slice(2,8)))}
function tagTime(c,a){if(c==='VM'){for(let i=a.length-1;i>=0;i--)if(!a[i]._t)a[i]._t=Date.now()*1000+(++tSeq)}else if(c==='CX'||c==='F'){for(let i=0;i<a.length;i++)if(!a[i]._t)a[i]._t=Date.now()*1000+(++tSeq)}}
const ser=(c,x)=>JSON.stringify(x,(k,v)=>(c==='P'&&k==='res')?undefined:v);
function atuais(){const m={};Object.keys(COLS).forEach(c=>{const a=COLS[c]();tagTime(c,a);a.forEach(x=>{m[c+'|'+chave(c,x)]=ser(c,x)})});return m}
async function buscar(){
 const out=[];let off=0;
 for(;;){const r=await sb('/rest/v1/registros?select=colecao,id,dados&order=colecao,id&limit=1000&offset='+off);if(!r.ok)return null;const j=await r.json();out.push.apply(out,j);if(j.length<1000)break;off+=1000}
 return out}
function aplicar(rows,primeira){
 const by={};Object.keys(COLS).forEach(c=>by[c]=[]);
 const rem={};rows.forEach(r=>{if(by[r.colecao]){by[r.colecao].push(r.dados);rem[r.colecao+'|'+r.id]=JSON.stringify(r.dados)}});
 const cur=atuais(),nova={};
 Object.keys(COLS).forEach(c=>{
  const a=COLS[c](),ant={};a.forEach(x=>{ant[chave(c,x)]=x});
  const out=[];
  by[c].forEach(d=>{const k=chave(c,d);const lk=c+'|'+k;
   if(!primeira&&ant[k]&&cur[lk]!==snap[lk]){out.push(ant[k])}   /* alteração local ainda não salva: mantém */
   else out.push(d)});
  if(!primeira)Object.keys(ant).forEach(k=>{const lk=c+'|'+k;if(!rem[lk]&&cur[lk]!==snap[lk])out.push(ant[k])}); /* novo local ainda não salvo */
  if(c==='VM')out.sort((x,y)=>(y._t||0)-(x._t||0));
  else if(c==='CX'||c==='F')out.sort((x,y)=>(x._t||0)-(y._t||0));
  else out.sort((x,y)=>(+x.id||0)-(+y.id||0));
  a.length=0;out.forEach(x=>a.push(x))});
 P.forEach(p=>{p.res=0});
 {const fi=x=>FAM.findIndex(z=>z.k===x.f),mi=x=>{const f=FAM[fi(x)];return f?f.mod.findIndex(y=>y.n===x.m):0};P.sort((a,b)=>fi(a)-fi(b)||mi(a)-mi(b)||a.id-b.id)}
 Object.keys(rem).forEach(k=>{snap[k]=rem[k]});
 Object.keys(snap).forEach(k=>{if(!rem[k])delete snap[k]});
 pid=P.reduce((s,p)=>Math.max(s,p.id),0);rcN=RC.reduce((s,r)=>Math.max(s,r.id),0);mvN=V.reduce((s,v)=>Math.max(s,v.id),0)}

async function gravar(){
 if(saving){saveT=setTimeout(gravar,400);return}
 const cur=atuais(),up=[],del=[];
 Object.keys(cur).forEach(k=>{if(cur[k]!==snap[k]){const i=k.indexOf('|');up.push({colecao:k.slice(0,i),id:k.slice(i+1),dados:JSON.parse(cur[k]),atualizado:new Date().toISOString(),atualizado_por:sess.uid})}});
 Object.keys(snap).forEach(k=>{if(!(k in cur))del.push(k)});
 if(!up.length&&!del.length){estado('● Tudo salvo');return}
 saving=true;
 try{
  for(let i=0;i<up.length;i+=200){
   const r=await sb('/rest/v1/registros?on_conflict=colecao,id',{m:'POST',h:{Prefer:'resolution=merge-duplicates,return=minimal'},b:up.slice(i,i+200)});
   if(!r.ok)throw new Error('up '+r.status)}
  for(const k of del){const i=k.indexOf('|');
   const r=await sb('/rest/v1/registros?colecao=eq.'+encodeURIComponent(k.slice(0,i))+'&id=eq.'+encodeURIComponent(k.slice(i+1)),{m:'DELETE',h:{Prefer:'return=minimal'}});
   if(!r.ok)throw new Error('del '+r.status)}
  up.forEach(u=>{snap[u.colecao+'|'+u.id]=JSON.stringify(u.dados)});del.forEach(k=>{delete snap[k]});
  saveErr=false;estado('● Tudo salvo')
 }catch(e){saveErr=true;estado('⚠ Não salvo · tentando de novo');clearTimeout(saveT);saveT=setTimeout(gravar,8000)}
 saving=false;
 if(!saveErr){const c2=atuais();if(Object.keys(c2).some(k=>c2[k]!==snap[k])||Object.keys(snap).some(k=>!(k in c2)))agendar()}}
